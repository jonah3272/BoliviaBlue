name: Publish daily evidence reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-daily-articles.yml'
      - 'scripts/publish-daily-evidence.cjs'
      - 'shared/dailyEvidence.cjs'
      - 'api/_lib/dailyEvidenceStore.js'
  schedule:
    # 01:17 Bolivia. GitHub can delay or skip scheduled runs; no exact-time promise.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Completed Bolivia date YYYY-MM-DD (blank: recover last 7 days)'
        required: false
        type: string
      dry_run:
        description: 'Validate without publishing'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-daily-evidence
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install existing database client
        run: npm ci --omit=dev --ignore-scripts
      - name: Verify calculations and publication behavior
        run: node --test tests/daily-evidence.test.cjs tests/daily-evidence-store.test.cjs
      - name: Generate and verify dated evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPORT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
        run: node scripts/publish-daily-evidence.cjs
