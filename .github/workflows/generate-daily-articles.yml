# Free daily blog articles (replaces Railway daily article job).
name: Generate daily articles

on:
  schedule:
    # ~12:30 UTC = morning Bolivia (UTC-4)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Generate daily ES + EN articles
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_ENV: production
        run: node scripts/generate-daily-articles-once.js
