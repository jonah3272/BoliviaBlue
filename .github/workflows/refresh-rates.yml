# Free rate updater (replaces Railway scheduler for blue rates).
# Frontend reads from Supabase, so this is enough to keep quotes accurate.
name: Refresh blue rates

on:
  schedule:
    # ~every 15 minutes (GitHub can delay a few minutes under load)
    - cron: '*/15 * * * *'
  workflow_dispatch: # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Refresh rates into Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_ENV: production
        run: node scripts/refresh-rates-once.js

      # Soft nudge for Search Console freshness (no auth required)
      - name: Ping sitemap
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://boliviablue.com/sitemap.xml" || true
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://www.bing.com/ping?sitemap=https://boliviablue.com/sitemap.xml" || true
