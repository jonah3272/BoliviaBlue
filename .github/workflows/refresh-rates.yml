# Free rate updater (replaces Railway scheduler for blue rates).
# Frontend reads from Supabase, so this is enough to keep quotes accurate.
name: Refresh blue rates

on:
  schedule:
    # ~every 15 minutes (GitHub can delay a few minutes under load)
    - cron: '*/15 * * * *'
  workflow_dispatch: # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Install Playwright Chromium (for Visa/MC card FX when HTTP is blocked)
        working-directory: backend
        run: npx --yes playwright install chromium --with-deps

      - name: Refresh rates into Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_ENV: production
          CARD_RATE_BROWSER: '1'
        run: node scripts/refresh-rates-once.js
