# Free rate updater (replaces Railway scheduler for blue rates).
# Frontend reads from Supabase, so this is enough to keep quotes accurate.
#
# NOTE: GitHub Actions "*/15" cron often drifts 1–3h on free repos under load.
# We schedule every 5 minutes AND hit the Vercel /api/refresh-rates backup when
# CRON_SECRET is configured — whichever succeeds keeps rates fresh.
name: Refresh blue rates

on:
  schedule:
    # Every 5 minutes — GitHub may still delay, but this recovers faster than */15
    - cron: '*/5 * * * *'
  workflow_dispatch: # manual "Run workflow" button

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --omit=dev

      - name: Refresh rates into Supabase
        id: gha_refresh
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_ENV: production
        run: node scripts/refresh-rates-once.js

      # Backup path: Vercel serverless refresh (same Binance → Supabase write).
      # Add GitHub secret CRON_SECRET matching Vercel env CRON_SECRET.
      - name: Backup refresh via Vercel API
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skip Vercel backup refresh"
            exit 0
          fi
          # Use www (apex 307s) and -L so POST follows the redirect if any.
          # -w fails the step on non-2xx so we don't print OK on a bare 307 body.
          body="$(curl -fsSL -X POST "https://www.boliviablue.com/api/refresh-rates" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            -w "\nHTTP:%{http_code}")"
          echo "$body"
          echo "Vercel backup refresh OK"

      - name: Ping sitemap
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://boliviablue.com/sitemap.xml" || true
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://www.bing.com/ping?sitemap=https://boliviablue.com/sitemap.xml" || true
