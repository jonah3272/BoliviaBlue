<!DOCTYPE html>
<html lang="es-BO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Dólar blue Bolivia — Bolivia Blue</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #fff; color: #111827; }
    .box { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; max-width: 360px; box-sizing: border-box; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .live { font-size: 11px; color: #ef4444; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .cell { background: #f3f4f6; border-radius: 8px; padding: 10px; }
    .lbl { font-size: 11px; color: #6b7280; }
    .num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .unit { font-size: 12px; font-weight: 500; color: #6b7280; }
    .when { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
    a { font-size: 12px; color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box" id="w">Cargando dólar blue Bolivia…</div>
  <script>
    (function () {
      var API = 'https://www.boliviablue.com/api/blue-rate';
      var HOME = 'https://www.boliviablue.com/dolar-blue-hoy?utm_source=embed&utm_medium=iframe';
      var el = document.getElementById('w');
      function fmt(n) {
        var x = Number(n);
        if (!isFinite(x) || x < 1) return '—';
        return x.toFixed(2);
      }
      fetch(API)
        .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
        .then(function (d) {
          var buy = fmt(d.buy_bob_per_usd);
          var sell = fmt(d.sell_bob_per_usd);
          var when = '';
          try {
            when = new Date(d.updated_at_iso).toLocaleString('es-BO', { dateStyle: 'short', timeStyle: 'short' });
          } catch (e) {}
          el.innerHTML =
            '<div class="row"><strong>Dólar Blue Bolivia</strong><span class="live">LIVE</span></div>' +
            '<div class="grid">' +
            '<div class="cell"><div class="lbl">Compra</div><div class="num">' + buy + ' <span class="unit">BOB</span></div></div>' +
            '<div class="cell"><div class="lbl">Venta</div><div class="num">' + sell + ' <span class="unit">BOB</span></div></div>' +
            '</div>' +
            (when ? '<div class="when">Actualizado: ' + when + '</div>' : '') +
            '<a href="' + HOME + '" target="_blank" rel="noopener">Datos de boliviablue.com →</a>';
        })
        .catch(function () {
          el.innerHTML = '<a href="' + HOME + '" target="_blank" rel="noopener">Ver cotización en boliviablue.com</a>';
        });
    })();
  </script>
</body>
</html>
